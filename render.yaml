services:
  - type: web
    name: brew-mud
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -e .
    startCommand: python -m brewmud.web --host 0.0.0.0
    healthCheckPath: /api/status
    envVars:
      - key: BREWMUD_DB_PATH
        value: /var/data/brewmud.db
    disk:
      name: brewmud-data
      mountPath: /var/data
      sizeGB: 1
